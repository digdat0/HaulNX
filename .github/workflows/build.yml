name: Build HaulNX

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: HaulNX-${{ github.sha }}
          path: "*.nro"
